<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>萌蛋合成</title>
<style>
 *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 html,body{width:100%;height:100%;overflow:hidden;background:#BFE3FF;font-family:"Comic Sans MS","Segoe UI",system-ui,sans-serif;}
 #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
 #c{display:block;touch-action:none;image-rendering:auto;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.25);}
 #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
   background:rgba(255,255,255,.35);backdrop-filter:blur(3px);text-align:center;color:#5a3ec0;pointer-events:auto;}
 #overlay.hidden{display:none;}
 #overlay h1{font-size:34px;text-shadow:0 2px 0 #fff,0 6px 14px rgba(0,0,0,.15);}
 #overlay p{margin:8px 0 18px;font-size:15px;color:#6b5aae;}
 #startBtn{border:none;cursor:pointer;padding:14px 34px;font-size:20px;font-weight:bold;color:#fff;border-radius:999px;
   background:linear-gradient(#FF9A3D,#FF6A88);box-shadow:0 6px 0 #d84a6a,0 10px 22px rgba(0,0,0,.2);transition:transform .05s;}
 #startBtn:active{transform:translateY(3px);box-shadow:0 3px 0 #d84a6a;}
 #tip{margin-top:16px;font-size:12px;line-height:1.6;color:#7c6dc0;max-width:min(90vw,400px);padding:0 10px;}
 #ad{position:fixed;inset:0;z-index:20;background:rgba(20,20,40,.72);display:flex;align-items:center;justify-content:center;}
 #ad.hidden{display:none;}
 .adbox{background:#fff;border-radius:18px;padding:24px 28px;text-align:center;color:#3a3a5a;max-width:320px;box-shadow:0 20px 50px rgba(0,0,0,.35);}
 .adbox h1{font-size:20px;margin-bottom:8px;}
 .adbox p{font-size:14px;margin-bottom:16px;color:#6b6b8a;}
 #adBtn{border:none;cursor:pointer;padding:12px 26px;font-size:17px;font-weight:bold;color:#fff;border-radius:999px;font-family:inherit;
   background:linear-gradient(#FF9A3D,#FF6A88);box-shadow:0 4px 0 #d84a6a;}
 #adBtn[disabled]{filter:grayscale(.5);opacity:.8;cursor:default;}
 #overlay{z-index:6;}
</style>
</head>
<body>
<div id="wrap">
 <canvas id="c"></canvas>
</div>
<div id="overlay">
 <h1>🥚 萌蛋合成</h1>
 <p>拖动瞄准 · 松手掉落，相同颜色的蛋相碰即升级！</p>
 <button id="startBtn">开始游戏</button>
 <div id="tip">别让蛋堆超过顶部红线 ✯ 分数越高、出球越大越难堆<br>彩虹球合并送 1 次「摇一摇」·「摇一摇」/「倒水」每局各 1 次 · v26</div>
</div>
<div id="ad" class="hidden">
 <div class="adbox">
  <h1>📺 广告播放中</h1>
  <p id="adText">观看完毕即可获得 1 次机会</p>
  <button id="adBtn" disabled>请稍候…</button>
 </div>
</div>
<script>
(function(){
"use strict";

// ---------- config (gameplay identical to original) ----------
var LOG_W=400, LOG_H=720;
var FLOOR_Y=LOG_H-58;      // playfield floor (legend moved to top, control bar at bottom)
var DANGER_Y=130;
var OVERTIME=5.0;          // seconds a ball may rest above the line before game over          // overflow danger line
var SPAWN_Y=100;
var MARGIN=6;
var GRAV=1150;
var MERGE_COOLDOWN_MS=140;
var R=[12,20,23,25,31,36,41,47,52,59];   // radii approved by user
var WEIGHTS=[45,28,16,10,6,4,3,2,0,0];    // natural spawn weights (tier8/9 = 0 => only via merge)
var NAMES=["小白","彩点","条纹","波点","星星","漩涡","爱心","冰晶","金辉","彩虹"];

// ---------- difficulty: score -> level (the only progression source) ----------
// row: [触发分数, 顶线y, 容错秒, 计时回退倍率, 生成下限tier, 生成上限tier, 生成权重]
// 顶线(130)、容错(5.0s)、计时回退(2x)全部恒定不动 —— 难度只来自"出球"
var LEVELS=[
 [0,     130, 5.0, 2.0, 0, 4, [45,28,16,10, 6, 0, 0, 0, 0,0]],
 [400,   130, 5.0, 2.0, 0, 4, [45,28,16,10, 6, 0, 0, 0, 0,0]],
 [1000,  130, 5.0, 2.0, 0, 5, [44,28,16,10, 6, 4, 0, 0, 0,0]],
 [2000,  130, 5.0, 2.0, 0, 5, [42,27,16,11, 7, 5, 0, 0, 0,0]],
 [3200,  130, 5.0, 2.0, 0, 6, [40,27,16,11, 7, 5, 3, 0, 0,0]],
 [4800,  130, 5.0, 2.0, 0, 6, [36,26,16,11, 8, 5, 3, 0, 0,0]],
 [6800,  130, 5.0, 2.0, 0, 7, [32,25,16,12, 9, 6, 4, 2, 0,0]],
 [9200,  130, 5.0, 2.0, 0, 7, [27,23,16,12,11, 8, 6, 3, 0,0]],
 [12000, 130, 5.0, 2.0, 0, 8, [23,21,16,13,12, 8, 7, 4, 0,0]],
 [15000, 130, 5.0, 2.0, 0, 8, [19,19,15,13,12, 9, 8, 5, 1,0]],
 [19000, 130, 5.0, 2.0, 0, 8, [16,17,14,13,13,10, 9, 6, 2,0]]
];
var LV_STEP_END=30000;                   // 关表跑完后: 每 +30000 分升一关, 出球参数停在第11关
var LV_SCALE=1.0;                        // ★总难度旋钮★ 唯一要调的数字: <1 更难(门槛提前), >1 更简单(门槛推后)
var LV=0, dangerTarget=130, overTarget=5.0, odDecay=2.0;
var spawnLo=0, spawnHi=4, spawnW=WEIGHTS.slice();
var lvFlashT=0, lvFlashLv=0;
function lvThr(i){ var raw=(i<LEVELS.length)?LEVELS[i][0]:LEVELS[LEVELS.length-1][0]+(i-(LEVELS.length-1))*LV_STEP_END; return Math.round(raw*LV_SCALE); }
function levelOf(sc){ var last=LEVELS.length-1, t0=lvThr(last), step=Math.max(1,Math.round(LV_STEP_END*LV_SCALE));
 if(sc>=t0) return last+Math.floor((sc-t0)/step);
 for(var i=last;i>=0;i--){ if(sc>=lvThr(i)) return i; } return 0; }
function levelStart(L){ return lvThr(L); }
function applyLevel(L,snap){ var r=LEVELS[Math.min(L,LEVELS.length-1)];
 dangerTarget=r[1]; overTarget=r[2]; odDecay=r[3]; spawnLo=r[4]; spawnHi=r[5]; spawnW=r[6];
 if(snap){ DANGER_Y=dangerTarget; OVERTIME=overTarget; } }

var canvas=document.getElementById("c");
var ctx=canvas.getContext("2d");
var overlay=document.getElementById("overlay");
var startBtn=document.getElementById("startBtn");
var dpr=Math.min(window.devicePixelRatio||1,2);

function resize(){
 var maxW=Math.max(120,window.innerWidth-16), maxH=Math.max(200,window.innerHeight-16);
 var cssW=Math.min(maxW,480), cssH=cssW*(LOG_H/LOG_W);
 if(cssH>maxH){ cssH=maxH; cssW=cssH*(LOG_W/LOG_H); }   // always keep the 400:720 ratio (no stretching)
 canvas.style.width=cssW+"px";
 canvas.style.height=cssH+"px";
 canvas.width=Math.round(cssW*dpr);
 canvas.height=Math.round(cssH*dpr);
}
window.addEventListener("resize",resize);
resize();

// ---------- background (bright, lively) drawn once ----------
var bgCanvas=document.createElement("canvas");
bgCanvas.width=LOG_W; bgCanvas.height=LOG_H;
var bx=bgCanvas.getContext("2d");
function drawBackground(){
 var sky=bx.createLinearGradient(0,0,0,LOG_H);
 sky.addColorStop(0,"#9AE0FF"); sky.addColorStop(.45,"#CDEBFF"); sky.addColorStop(.8,"#FFF6D6"); sky.addColorStop(1,"#FFE9C4");
 bx.fillStyle=sky; bx.fillRect(0,0,LOG_W,LOG_H);
 // clouds
 function cloud(cx,cy,s){ bx.fillStyle="rgba(255,255,255,.92)";
   [[-28,0,22],[0,-8,28],[26,2,24],[-12,10,20],[12,12,20]].forEach(function(p){ bx.beginPath(); bx.arc(cx+p[0],cy+p[1],p[2],0,Math.PI*2); bx.fill(); }); }
 cloud(86,120,1); cloud(250,70,.8); cloud(170,180,.7); cloud(300,150,.6);
 // rolling hills
 bx.fillStyle="#BCEAA0"; bx.beginPath(); bx.moveTo(0,LOG_H-70);
 bx.quadraticCurveTo(110,LOG_H-130,220,LOG_H-86); bx.quadraticCurveTo(320,LOG_H-50,LOG_W,LOG_H-96);
 bx.lineTo(LOG_W,LOG_H); bx.lineTo(0,LOG_H); bx.closePath(); bx.fill();
 bx.fillStyle="#A6E184"; bx.beginPath(); bx.moveTo(0,LOG_H-46);
 bx.quadraticCurveTo(150,LOG_H-90,300,LOG_H-60); bx.quadraticCurveTo(380,LOG_H-44,LOG_W,LOG_H-70);
 bx.lineTo(LOG_W,LOG_H); bx.lineTo(0,LOG_H); bx.closePath(); bx.fill();
 // ground strip (legend area)
 var gr=bx.createLinearGradient(0,FLOOR_Y,0,LOG_H); gr.addColorStop(0,"#8FDC66"); gr.addColorStop(1,"#74C44E");
 bx.fillStyle=gr; bx.fillRect(0,FLOOR_Y,LOG_W,LOG_H-FLOOR_Y);
 bx.strokeStyle="#5FAE3B"; bx.lineWidth=3; bx.beginPath(); bx.moveTo(0,FLOOR_Y); bx.lineTo(LOG_W,FLOOR_Y); bx.stroke();
 // sprinkles on grass
 bx.fillStyle="rgba(255,255,255,.5)";
 for(var j=0;j<26;j++){ bx.beginPath(); bx.arc((j*97%LOG_W),(FLOOR_Y+8+(j*53)%(LOG_H-FLOOR_Y-6)),1.6,0,Math.PI*2); bx.fill(); }
 if(bgImg){ try{ var iw=bgImg.naturalWidth||bgImg.width||480, ih=bgImg.naturalHeight||bgImg.height||864; var sc=Math.max(LOG_W/iw,LOG_H/ih); var dw=iw*sc, dh=ih*sc; bx.drawImage(bgImg,(LOG_W-dw)/2,(LOG_H-dh)/2,dw,dh); }catch(err){} } // aspect-preserving cover: any image size, never stretched
}
drawBackground();

// ---------- egg art (varied colors/styles) ----------
var TOP=["#FFF6C2","#FFDCEE","#D6F0FF","#E2F7D3","#FFE6C2","#EDE0FF","#FFD9DE","#E5FAFF","#FFF3B8","#FAD0E6"];
var BOT=["#FFD24A","#FF9EC4","#7FC6FF","#9AE06A","#FFAB40","#B388FF","#EC5050","#40C9E0","#FFC107","#FF7EB3"];

function star(cx,cy,spikes,out,inn,rot){
 bx.save && 0; // noop guard
}
function drawStar(c,x,y,sp,rOut,rIn,rot){
 var step=Math.PI/sp; var ang=rot-Math.PI/2;
 c.beginPath();
 for(var i=0;i<sp;i++){
   c.lineTo(x+Math.cos(ang)*rOut,y+Math.sin(ang)*rOut); ang+=step;
   c.lineTo(x+Math.cos(ang)*rIn,y+Math.sin(ang)*rIn); ang+=step;
 }
 c.closePath(); c.fill();
}
function drawHeart(c,x,y,s){
 c.beginPath();
 c.moveTo(x,y+s*0.3);
 c.bezierCurveTo(x-s,y-s*0.3,x-s*0.3,y+s*0.5,x,y+s);
 c.bezierCurveTo(x+s*0.3,y+s*0.5,x+s,y-s*0.3,x,y+s*0.3);
 c.closePath(); c.fill();
}

function drawPattern(idx,c,s){
 c.save();
 switch(idx){
 case 0: c.fillStyle="rgba(255,255,255,.85)";
   [[-0.3,-0.1,.12],[0.28,0.05,.1],[-0.1,0.34,.09],[0.4,-0.32,.08]].forEach(function(p){c.beginPath();c.arc(s*p[0],s*p[1],s*p[2],0,6.283);c.fill();}); break;
 case 1: c.fillStyle="rgba(255,140,180,.55)";
   for(var y=-s;y<s;y+=s*0.4){ c.fillRect(-s,y+s*0.1,s*2,s*0.16);} break;
 case 2: c.fillStyle="rgba(70,140,220,.6)";
   [[-0.28,-0.14,.11],[0.3,0,.1],[-0.06,0.32,.09],[0.36,-0.34,.07]].forEach(function(p){c.beginPath();c.arc(s*p[0],s*p[1],s*p[2],0,6.283);c.fill();}); break;
 case 3: c.strokeStyle="rgba(80,170,60,.7)"; c.lineWidth=s*0.09; c.lineCap="round";
   c.beginPath(); var zy=-s*0.3;
   for(var x=-s;x<=s;x+=s*0.4){ c.lineTo(x,zy+(x>0?s*0.18:-s*0.18)); zy=-zy-(x>s*0? 0:0); } // simplified zig
   c.stroke(); break;
 case 4: c.fillStyle="#FFD24A";
   [[-0.3,-0.1,.16],[0.3,0.06,.13],[-0.1,0.36,.11],[0.34,-0.36,.09]].forEach(function(p){drawStar(c,s*p[0],s*p[1],5,s*p[2],s*p[2]*0.42,-0.4);}); break;
 case 5: c.strokeStyle="rgba(120,80,190,.6)"; c.lineWidth=s*0.08; c.lineCap="round";
   for(var k=0;k<3;k++){ c.beginPath(); c.arc(s*(-0.2+k*0.2),s*0.0,s*0.22,k*0.8,k*0.8+3.4); c.stroke(); } break;
 case 6: c.fillStyle="rgba(236,80,80,.75)";
   [[-0.28,-0.1,.14],[0.3,0.06,.12],[-0.06,0.34,.1]].forEach(function(p){drawHeart(c,s*p[0],s*p[1],s*p[2]);}); break;
 case 7: c.strokeStyle="rgba(30,170,200,.8)"; c.lineWidth=s*0.06; c.lineCap="round";
   for(var a=0;a<6;a++){ var A=a/6*6.283; c.beginPath(); c.moveTo(0,0); c.lineTo(Math.cos(A)*s*0.28,Math.sin(A)*s*0.28); c.stroke();
     c.beginPath(); c.moveTo(Math.cos(A)*s*0.16,Math.sin(A)*s*0.16); c.lineTo(Math.cos(A+0.5)*s*0.1,Math.sin(A+0.5)*s*0.1); c.stroke(); } break;
 case 8: c.strokeStyle="rgba(255,190,0,.7)"; c.lineWidth=s*0.07; c.lineCap="round";
   for(var m=0;m<12;m++){ var M=m/12*6.283; c.beginPath(); c.moveTo(Math.cos(M)*s*0.2,Math.sin(M)*s*0.2); c.lineTo(Math.cos(M)*s*0.46,Math.sin(M)*s*0.46); c.stroke(); } break;
 case 9: c.fillStyle="#fff";
   [[-0.34,-0.2,.08],[0.34,-0.1,.07],[-0.16,0.32,.07],[0.28,0.3,.06],[0,0,.06]].forEach(function(p){drawStar(c,s*p[0],s*p[1],6,s*p[2],s*p[2]*0.4,0);}); break;
 }
 c.restore();
}

function drawEgg(idx,cx,cy,s,a){
 var sp=EGGSPR[idx];
 if(sp){ var dw=s*2.06, dh=dw*sp.h/sp.w; ctx.drawImage(sp.canvas, sp.x,sp.y,sp.w,sp.h, cx-dw/2, cy-dh/2, dw, dh); return; }
 // s = radius unit; a = spin angle (rolls with angular velocity)
 ctx.save();
 ctx.translate(cx,cy);
 /* rotation not drawn: perfect circles + upright faces -> no visible spin */
 // body
 var g=ctx.createRadialGradient(-s*0.3,-s*0.35,s*0.15,0,0,s*1.05);
 g.addColorStop(0,TOP[idx]); g.addColorStop(1,BOT[idx]);
 ctx.fillStyle=g;
 ctx.beginPath(); ctx.arc(0,0,s,0,6.283); ctx.fill();
 ctx.lineWidth=s*0.03; ctx.strokeStyle="rgba(0,0,0,.12)"; ctx.stroke();
 // rainbow sheen for tier9
 if(idx===9){ ctx.save(); ctx.beginPath(); ctx.arc(0,0,s*0.92,0,6.283); ctx.clip();
   var rg=ctx.createLinearGradient(-s,-s,s,s);
   rg.addColorStop(0,"rgba(255,90,120,.4)"); rg.addColorStop(.5,"rgba(90,220,255,.4)"); rg.addColorStop(1,"rgba(255,220,90,.4)");
   ctx.fillStyle=rg; ctx.fillRect(-s,-s,s*2,s*2); ctx.restore(); }
 /* interior pattern lines removed for clean round balls */
 // glossy highlight
 ctx.fillStyle="rgba(255,255,255,.5)";
 ctx.beginPath(); ctx.ellipse(-s*0.32,-s*0.42,s*0.2,s*0.13,-0.5,0,6.283); ctx.fill();
 // face
 var ey=-s*0.14, ex=s*0.30, er=s*0.17;
 ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(-ex,ey,er,0,6.283); ctx.arc(ex,ey,er,0,6.283); ctx.fill();
 ctx.fillStyle="#3a2c2a"; ctx.beginPath(); ctx.arc(-ex+s*0.05,ey+s*0.03,er*0.55,0,6.283); ctx.arc(ex+s*0.05,ey+s*0.03,er*0.55,0,6.283); ctx.fill();
 ctx.strokeStyle="#7a4b2a"; ctx.lineWidth=s*0.05; ctx.lineCap="round";
 ctx.beginPath(); ctx.arc(0,ey+s*0.14,s*0.22,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
 ctx.fillStyle="rgba(255,130,150,.6)";
 ctx.beginPath(); ctx.arc(-ex-s*0.05,ey+s*0.22,s*0.1,0,6.283); ctx.arc(ex+s*0.05,ey+s*0.22,s*0.1,0,6.283); ctx.fill();
 ctx.restore();
}

// ---------- game state ----------
var orbs=[]; var parts=[]; var score=0; var best=+(localStorage.getItem("eggBest")||0);
var paused=true; var over=false; var aimX=LOG_W/2; var lastSpawnTier=0; var maxTier=0;
var shakeT=0, shakeMag=0; var odTimer=0; window.__OD=0;
var rainbowT=0, rainbowX=LOG_W/2, rainbowY=300, rainbowGot=0, rainbowGiven=0, rainbowLastT=-1e9;   // 彩虹球合并提示
var dt=0;

function nextTier(){ var lo=spawnLo, hi=spawnHi, tot=0; for(var i=lo;i<=hi;i++) tot+=spawnW[i];
 var r=Math.random()*tot; for(var i=lo;i<=hi;i++){ r-=spawnW[i]; if(r<=0) return i; } return hi; }
function maxSpawnTier(){ return spawnHi; }   // level-driven natural drop cap

function spawnOrb(i,x,y){ var r=R[i]; var m=r*r; var I=0.5*m*r*r; _asleep=0; _calmCount=0; orbs.push({cid:++_cidCounter,i:i,x:x,y:y,vx:0,vy:0,w:0,a:0,r:r,born:performance.now(),pop:1,slow:0,lock:0,mass:m,imass:1/m,inertia:I,inertiainv:1/I}); }

function resetGame(){ orbs=[]; parts=[]; score=0; maxTier=0; paused=false; over=false;
 LV=0; applyLevel(0,true); lvFlashT=0; lvFlashLv=0;
 aimX=LOG_W/2; lastSpawnTier=nextTier(); odTimer=0; rainbowGiven=0; rainbowLastT=-1e9; window.__OD=0; shakeLeft=SHAKE_MAX; waterLeft=WATER_MAX; noLockT=0; floatT=0; shakeEffT=0; shakePhase=0; noOverT=0; adActive=false; adEl.classList.add("hidden"); }

// ---------- physics (identical solver to original) ----------
// ---------- physics: mature Box2D-style sequential-impulse solver ----------
// * accumulated impulses clamped (contact>=0, friction Coulomb cone) -> no jitter / explosion
// * Baumgarte positional correction applied DIRECTLY to positions (pseudo-impulse), never into velocity -> energy-free, stable stacks
// * rotational inertia so tangential friction makes balls ROLL instead of slide
// * restitution ~0 (soft eggs), warm-started impulses across frames -> rock-solid resting stacks
var FRICTION=0.35, RESTITUTION=0.06, BIAS=0.25, SLOP=0.3, MAXCORRFAC=0.8, ROLL_RESIST=5.0;
var VEL_ITERS=12, POS_ITERS=10, VEL_CAP=1400, ANG_CAP=12, ANG_DRAG=90, REST_THRESH=90, SLEEP_SPD=30, SLEEP_HOLD=50, LOCK_SPD=20, LOCK_HOLD=12, LOCK_MASS=0.12, WAKE_SPD=250, _asleep=0,_calmCount=0;
var _cidCounter=0; var impCache={}; // persistent warm-start cache keyed by stable egg ids
var STATICBODY={vx:0,vy:0,w:0,imass:0,inertiainv:0,x:0,y:0,r:0,mass:0}; function bodyOf(i){ return i<0?STATICBODY:orbs[i]; }
window.__PILE=function(){ var topY=1e9,wmin=1e9,wmax=-1e9,mxv=0,n=orbs.length; for(var i=0;i<orbs.length;i++){var o=orbs[i]; if(o.y-o.r<topY)topY=o.y-o.r; if(o.x<wmin)wmin=o.x; if(o.x>wmax)wmax=o.x; var sp=Math.abs(o.vx)+Math.abs(o.vy); if(sp>mxv)mxv=sp;} return {n:n,topY:Math.round(topY),spread:Math.round(wmax-wmin),maxSpeed:Math.round(mxv)}; };

function canMerge(a,b,now){ return a.i===b.i && (now-a.born>MERGE_COOLDOWN_MS) && (now-b.born>MERGE_COOLDOWN_MS); }

 for(var i=0;i<orbs.length;i++){
  for(var j=i+1;j<orbs.length;j++){
   var A=orbs[i],B=orbs[j]; if(removed[i]||removed[j]) continue;
   if(!canMerge(A,B,now)) continue;
   var ddx=B.x-A.x,ddy=B.y-A.y; if(Math.hypot(ddx,ddy)>(A.r+B.r)+1.5) continue;
   if(A.i>=9){ removed[i]=true; removed[j]=true; score+=2000; shakeT=performance.now(); shakeMag=2.5;
    var _rnow=performance.now(), _got=0;
    if(shakeLeft<1 && rainbowGiven<RAINBOW_SHAKE_MAX && (_rnow-rainbowLastT)>RAINBOW_SHAKE_CD*1000){ shakeLeft++; rainbowGiven++; rainbowLastT=_rnow; _got=1; }
    rainbowT=_rnow; rainbowGot=_got; rainbowX=Math.max(96,Math.min(LOG_W-96,(A.x+B.x)/2)); rainbowY=Math.min(A.y,B.y);
    burst(A.x,A.y,"#FF7EB3"); burst(B.x,B.y,"#FF7EB3"); burst(A.x,A.y,"#FFF3B8"); burst(B.x,B.y,"#FFF3B8"); continue; }
   var ni=A.i+1; var mx=(A.x+B.x)/2, my=(A.y+B.y)/2;
   var nr=R[ni],ny=my;for(var g=0;g<400&&ny>nr;g++){var ok=true;for(var o=0;o<orbs.length;o++){if(o===i||o===j)continue;var Pp=orbs[o];if(Math.hypot(mx-Pp.x,ny-Pp.y)<nr+Pp.r+0.6){ok=false;break;}}if(ok)break;ny-=1;}spawnOrb(ni,mx,ny);

 return { x:(t.clientX-r.left)*(LOG_W/r.width), y:(t.clientY!=null?(t.clientY-r.top)*(LOG_H/r.height):-1) }; }

function adLoad(cb){

  } else {

    if(n==="SDK_READY") fin(true);
    else if(n==="SDK_GAME_START"){ if(adFinish) adFinish(true); } }};
   adInject("https://api.gamemonetize.com/sdk.js");
  }

}

function adRewarded(grant){

  if(!ok){ grant(false); return; }
  var done=false;
  adFinish=function(d){ if(done) return; done=true; adFinish=null; if(adWatchdog){ clearTimeout(adWatchdog); adWatchdog=null; } grant(!!d); };
  adWatchdog=setTimeout(function(){ if(!done){ done=true; adFinish=null; grant(true); } }, 90000);
  try{

    var p=window.gdsdk.preloadAd("rewarded");
    if(p&&p.then){ p.then(function(){ window.gdsdk.showAd("rewarded"); }).catch(function(){ if(adFinish) adFinish(true); }); }
    else { window.gdsdk.showAd("rewarded"); }

    var q=window.GamePixSDK.showAd("rewarded");
    if(q&&q.then){ q.then(function(){ if(adFinish) adFinish(true); }).catch(function(){ if(adFinish) adFinish(true); }); }

}

function toast(msg){ toastT=performance.now(); toastMsg=msg; }
function doShakeNow(){ unlockAll(); shakeEffT=SHAKE_TIME; noLockT=SHAKE_TIME; noOverT=SHAKE_TIME+1.3; shakePhase=0; shakeT=performance.now(); shakeMag=9; snd(300,0.14,"square"); }
function doWaterNow(){ unlockAll(); floatT=FLOW_TIME; noLockT=FLOW_TIME; noOverT=FLOW_TIME+1.3; snd(720,0.25,"sine"); }

function requestUse(kind){
 if(paused||over||adActive) return;
 if(kind==="shake"&&shakeEffT>0) return;
 var left=(kind==="shake")?shakeLeft:waterLeft;
 if(left>0){ if(kind==="shake"){ shakeLeft--; doShakeNow(); } else { waterLeft--; doWaterNow(); } return; }
 if(adPlatform==="none"){
  if(freeUsed[kind]<FREE_REFILL_MAX){ freeUsed[kind]++;
   if(kind==="shake"){ shakeLeft++; doShakeNow(); } else { waterLeft++; doWaterNow(); }
   toast("本平台暂无广告 · 免费赠送 1 次"); }
  else { toast("技能已用完(本平台暂无广告)"); }
  return; }
 adKind=kind; adActive=true; adEl.classList.remove("hidden");
 adBtn.disabled=true; adBtn.textContent="广告加载中…";
 adTextEl.textContent="看完广告即可获得 1 次「"+(kind==="shake"?"摇一摇":"倒水")+"」";
 adRewarded(function(done){
  adActive=false; adEl.classList.add("hidden"); adBtn.disabled=false;
  if(done){ if(kind==="shake"){ shakeLeft++; doShakeNow(); } else { waterLeft++; doWaterNow(); } }
  else { toast("广告加载失败,请稍后再试"); }
 });
}

// 页面加载时就认出平台并预载 SDK —— 否则第一次点击会因为 SDK 还没到而误判成"无广告"
adPlatform=adDetect();
if(adPlatform!=="none"){ adLoad(function(){}); }
function doShake(src){ requestUse("shake"); }
function doWater(){ requestUse("water"); }
function updAd(dt){ if(!adActive) return; adLeft=(adLeft||0)+dt; adBtn.textContent="广告加载中…"; }
function activateBtn(id){ if(id==="shake") requestUse("shake"); else if(id==="water") requestUse("water"); }
adBtn.addEventListener("click",function(e){ e.stopPropagation(); });

// ---------- simple sound ----------
var actx=null; function snd(f,d,t){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); var o=actx.createOscillator(),g=actx.createGain(); o.type=t||"sine"; o.frequency.value=f; g.gain.value=0.04; o.connect(g); g.connect(actx.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d); o.stop(actx.currentTime+d);}catch(err){} }

// ---------- particles update ----------
function updParts(dt){ for(var i=parts.length-1;i>=0;i--){ var p=parts[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=GRAV*0.5*dt; if(p.life<=0) parts.splice(i,1); } }

function drawLegend(){ var cell=LOG_W/10; 
 ctx.save(); ctx.fillStyle="rgba(255,255,255,.42)"; roundRect(-8,-10,LOG_W+16,52,14); ctx.fill();
 ctx.fillStyle="rgba(120,100,200,.10)"; ctx.fillRect(0,38,LOG_W,2); ctx.restore();
 for(var i=0;i<10;i++){ var cx=i*cell+cell/2; var cy=15;
  ctx.save(); ctx.fillStyle=(i%2?"rgba(255,255,255,.34)":"rgba(255,255,255,.62)"); roundRect(i*cell+2,2,cell-4,34,9); ctx.fill(); ctx.restore();
  drawEgg(i,cx,cy,Math.min(11,cell*0.26));
  ctx.fillStyle="#5a3ec0"; ctx.font="bold 9px sans-serif"; ctx.textAlign="center";
  ctx.fillText(NAMES[i],cx,33);
  if(i<maxTier){ ctx.fillStyle="rgba(255,150,20,.95)"; ctx.beginPath(); ctx.arc(cx+cell*0.33,6,3.5,0,6.283); ctx.fill(); } } }

function drawLevel(){
 var prevSc=levelStart(LV), nextSc=levelStart(LV+1);
 var p=Math.max(0,Math.min(1,(score-prevSc)/Math.max(1,nextSc-prevSc)));
 ctx.save();
 ctx.fillStyle="rgba(255,255,255,.30)"; roundRect(6,42,LOG_W-12,26,13); ctx.fill();
 ctx.fillStyle="rgba(255,255,255,.92)"; roundRect(8,44,64,22,11); ctx.fill();
 ctx.textAlign="center"; ctx.textBaseline="middle";
 ctx.fillStyle="#4a34a0"; ctx.font="bold 13px sans-serif"; ctx.fillText("第"+(LV+1)+"关",40,56);
 ctx.fillStyle="rgba(255,255,255,.50)"; roundRect(78,52,238,8,4); ctx.fill();
 var lg=ctx.createLinearGradient(78,0,316,0); lg.addColorStop(0,"#7BD77B"); lg.addColorStop(.55,"#FFC94A"); lg.addColorStop(1,"#F2604F");
 ctx.fillStyle=lg; roundRect(78,52,Math.max(4,238*p),8,4); ctx.fill();
 ctx.textAlign="right"; ctx.fillStyle="rgba(70,60,130,.80)"; ctx.font="bold 9px sans-serif";
 ctx.fillText("下一关 "+nextSc+(LV+1<LEVELS.length?"":("+"+Math.round(LV_STEP_END*LV_SCALE))),LOG_W-10,56);
 ctx.restore();
}
function render(now){
 ctx.setTransform(canvas.width/LOG_W,0,0,canvas.height/LOG_H,0,0);
 ctx.drawImage(bgCanvas,0,0);
 // shake
 if((shakeT>0 && now-shakeT<180)||noLockT>0){ var smg=(noLockT>0?9:shakeMag); var sx=(Math.random()-0.5)*smg*0.5; var sy=(shakeEffT>0?Math.sin(now*0.045)*smg:(Math.random()-0.5)*smg);
   ctx.setTransform(canvas.width/LOG_W,0,0,canvas.height/LOG_H,sx,sy); ctx.drawImage(bgCanvas,0,0); ctx.setTransform(canvas.width/LOG_W,0,0,canvas.height/LOG_H,0,0); }
 // danger line
 ctx.save(); ctx.strokeStyle="rgba(230,70,90,.85)"; ctx.lineWidth=3; ctx.setLineDash([10,8]);
 ctx.beginPath(); ctx.moveTo(0,DANGER_Y); ctx.lineTo(LOG_W,DANGER_Y); ctx.stroke(); ctx.restore();
 ctx.fillStyle="rgba(230,70,90,.85)"; ctx.font="bold 12px sans-serif"; ctx.textAlign="left"; ctx.fillText("⚠ 顶线",8,DANGER_Y-6);
 ctx.fillStyle="rgba(230,70,90,.72)"; ctx.font="bold 10px sans-serif";
 ctx.fillText("出球 "+(spawnLo+1)+"~"+(spawnHi+1)+" 级",68,DANGER_Y-6);
 // guide + preview
 if(!paused&&!over){ var rr=R[lastSpawnTier];
  ctx.save(); ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=2; ctx.setLineDash([6,8]);
  ctx.beginPath(); ctx.moveTo(aimX,SPAWN_Y+rr); ctx.lineTo(aimX,FLOOR_Y); ctx.stroke(); ctx.restore();
  ctx.globalAlpha=0.9; drawEgg(lastSpawnTier,aimX,SPAWN_Y,rr); ctx.globalAlpha=1; }
 // orbs
 for(var i=0;i<orbs.length;i++){ var o=orbs[i]; var pop=1+Math.max(0,o.pop)*0.05; o.pop=Math.max(0,o.pop-dt*4);
  var s=o.r*pop; drawEgg(o.i,o.x,o.y,s,o.a); }
 // particles
 for(var k=0;k<parts.length;k++){ var p=parts[k]; ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.c;
  ctx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s); } ctx.globalAlpha=1;
 // generic toast (无广告平台提示等)
 if(toastT>0){ var tl=(performance.now()-toastT)/1000; if(tl<3.0){ var ta=1-tl/3.0;
  ctx.save(); ctx.globalAlpha=ta; ctx.textAlign="center"; ctx.font="bold 14px sans-serif";
  ctx.fillStyle="rgba(20,20,50,.55)"; roundRect(58,96,LOG_W-116,30,15); ctx.fill();
  ctx.fillStyle="#fff"; ctx.fillText(toastMsg,LOG_W/2,116); ctx.restore(); } }
 // rainbow reward toast
 if(rainbowT>0){ var rl=(performance.now()-rainbowT)/1000; if(rl<1.7){ var ra=1-rl/1.7;
  ctx.save(); ctx.globalAlpha=ra; ctx.textAlign="center";
  ctx.font="bold 17px sans-serif";
  var _rt=rainbowGot?"🌈 彩虹合并! 摇一摇 +1":"🌈 彩虹合并! +2000";
  ctx.fillStyle="rgba(70,40,0,.45)"; ctx.fillText(_rt,rainbowX+1,rainbowY-26-rl*18+1);
  ctx.fillStyle="#FFB300"; ctx.fillText(_rt,rainbowX,rainbowY-26-rl*18);
  ctx.restore(); } }
 // hud
 if(floatT>0){ ctx.save(); ctx.fillStyle="rgba(80,170,255,.20)"; ctx.fillRect(0,0,LOG_W,FLOOR_Y); ctx.fillStyle="rgba(255,255,255,.45)"; for(var wb=0;wb<10;wb++){ var wbx=(wb*137+(now*0.03))%LOG_W; var wby=FLOOR_Y-((now*0.09+wb*90)%FLOOR_Y); ctx.beginPath(); ctx.arc(wbx,wby,3+(wb%4),0,6.283); ctx.fill(); } ctx.restore(); }
 drawLegend(); drawLevel();
 ctx.save();
 ctx.fillStyle="rgba(255,255,255,.30)"; roundRect(2,FLOOR_Y+2,LOG_W-4,54,16); ctx.fill();
 ctx.fillStyle="rgba(60,80,140,.16)"; roundRect(7,FLOOR_Y+10,108,44,12); ctx.fill();
 ctx.fillStyle="rgba(255,255,255,.92)"; roundRect(6,FLOOR_Y+7,108,44,12); ctx.fill();
 ctx.textAlign="left"; ctx.fillStyle="#8a76c8"; ctx.font="bold 9px sans-serif"; ctx.fillText("分数",18,FLOOR_Y+21);
 ctx.fillStyle="#4a34a0"; ctx.font="bold 17px sans-serif"; ctx.fillText(String(score),18,FLOOR_Y+41);
 ctx.fillStyle="#a99ad8"; ctx.font="bold 9px sans-serif"; ctx.fillText("最高 "+best,64,FLOOR_Y+21);
 ctx.textAlign="right"; ctx.fillStyle="rgba(120,100,200,.75)"; ctx.font="bold 8px sans-serif"; ctx.fillText("v29",110,FLOOR_Y+51);
 ctx.restore();
 drawButtons();

 if(shakeEffT>0||floatT>0){ ctx.save(); ctx.textAlign="center"; ctx.font="bold 14px sans-serif"; ctx.fillStyle="rgba(50,60,120,.8)"; ctx.fillText(shakeEffT>0?"摇一摇中…":"倒水中…",LOG_W/2,58); ctx.restore(); }
 if(lvFlashT>0){ lvFlashT=Math.max(0,lvFlashT-dt); var la=Math.min(1,lvFlashT/0.55);
  var lr=LEVELS[Math.min(lvFlashLv,LEVELS.length-1)];
  ctx.save(); ctx.globalAlpha=la; ctx.textAlign="center";
  ctx.fillStyle="rgba(20,20,50,.34)"; roundRect(40,172,320,78,20); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.95)"; ctx.font="bold 34px sans-serif"; ctx.fillText("第 "+(lvFlashLv+1)+" 关",LOG_W/2,212);
  ctx.fillStyle="#FFE9A8"; ctx.font="bold 13px sans-serif";
  ctx.fillText("出球上限提升到 "+(lr[5]+1)+" 级 · 大球变多了",LOG_W/2,236);
  ctx.restore(); }
 if(odTimer>0){ var _left=Math.max(0,OVERTIME-odTimer); ctx.save(); ctx.fillStyle="rgba(230,70,90,.16)"; ctx.fillRect(0,0,LOG_W,LOG_H); ctx.fillStyle="#E0465A"; ctx.textAlign="center"; ctx.font="bold 46px sans-serif"; ctx.fillText(_left.toFixed(1)+"s",LOG_W/2,LOG_H*0.42); ctx.font="bold 17px sans-serif"; ctx.fillText("球堆超过顶线!",LOG_W/2,LOG_H*0.42+30); ctx.restore(); }
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawButtons(){ for(var bi=0;bi<BTNS.length;bi++){ var b=BTNS[bi]; var act=(b.id==="shake"&&shakeEffT>0)||(b.id==="water"&&floatT>0); ctx.save(); if(act)ctx.globalAlpha=0.6; var cx=b.x+b.w/2, cy=b.y+b.h/2; var gr=ctx.createLinearGradient(0,b.y,0,b.y+b.h); if(b.id==="shake"){ gr.addColorStop(0,"#A9E5FF"); gr.addColorStop(0.48,"#5CB4EE"); gr.addColorStop(1,"#3A82D2"); } else { gr.addColorStop(0,"#B4F7DA"); gr.addColorStop(0.48,"#55CD9E"); gr.addColorStop(1,"#2F9E73"); } ctx.fillStyle="rgba(40,60,110,.28)"; roundRect(b.x,b.y+3,b.w,b.h,14); ctx.fill(); ctx.fillStyle=gr; roundRect(b.x,b.y,b.w,b.h,14); ctx.fill(); ctx.strokeStyle="rgba(255,255,255,.55)"; ctx.lineWidth=2; roundRect(b.x+1,b.y+1,b.w-2,b.h-2,13); ctx.stroke(); ctx.fillStyle="rgba(255,255,255,.42)"; roundRect(b.x+4,b.y+3,b.w-8,b.h*0.40,9); ctx.fill(); var ico=ICONIMG[b.id]; if(ico){ ctx.drawImage(ico,b.x+7,cy-14,28,28); } ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.font="bold 15px sans-serif"; ctx.fillText(b.id==="shake"?"摇一摇":"倒 水", b.x+13+(b.w-42)/2, cy+6); var cnt=(b.id==="shake"?shakeLeft:waterLeft); ctx.fillStyle="rgba(255,255,255,.95)"; ctx.beginPath(); ctx.arc(b.x+b.w-15,cy,12,0,6.283); ctx.fill(); ctx.fillStyle=(cnt>0?"#3a6ea8":"#c0504a"); ctx.font="bold 12px sans-serif"; ctx.fillText("×"+cnt, b.x+b.w-15, cy+4); ctx.restore(); } }

function keyEgg(img){ try{
 var c=document.createElement("canvas"); c.width=img.width; c.height=img.height;
 var g=c.getContext("2d"); g.drawImage(img,0,0);
 var d=g.getImageData(0,0,c.width,c.height), p=d.data;
 var minX=c.width,minY=c.height,maxX=-1,maxY=-1;
 for(var i=0;i<p.length;i+=4){ if(p[i+3]>24){ var id=i>>2, x=id%c.width, y=(id/c.width)|0; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; } }
 if(maxX<0){ minX=0; minY=0; maxX=c.width-1; maxY=c.height-1; }
 return {canvas:c,x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1};
 }catch(err){ return null; } }
function loadEggs(){ try{ if(typeof Image!=="function") return; for(var i=0;i<EGGSRC.length;i++){ (function(idx){ var im=new Image(); im.onload=function(){ EGGSPR[idx]=keyEgg(im); }; im.src=EGGSRC[idx]; })(i); } if(BGSRC){ bgImg=new Image(); bgImg.onload=function(){ try{ drawBackground(); }catch(e2){} }; bgImg.src=BGSRC; } for(var kk in ICONSRC){ if(!Object.prototype.hasOwnProperty.call(ICONSRC,kk)) continue; (function(key){ var ic=new Image(); ic.onload=function(){ ICONIMG[key]=ic; }; ic.src=ICONSRC[key]; })(kk); } }catch(err){} }

// ---------- loop ----------
var lastT=performance.now();
function loop(now){ dt=(now-lastT)/1000; lastT=now; if(dt>0.05) dt=0.05; updAd(dt);
 if(!paused&&!over){ physics(dt); updParts(dt);
  // difficulty ramp: ease live danger-line / grace toward the current level's values
  DANGER_Y+=(dangerTarget-DANGER_Y)*Math.min(1,dt*3.2);
  OVERTIME+=(overTarget-OVERTIME)*Math.min(1,dt*3.2);
  var _nl=levelOf(score); if(_nl>LV){ LV=_nl; applyLevel(LV); lvFlashT=2.0; lvFlashLv=LV; snd(880,0.16,"square"); snd(1320,0.22,"triangle"); }
  if(noOverT>0){ odTimer=0; }
  else if(checkOverflow()){ odTimer+=dt; if(odTimer>=OVERTIME){ over=true; paused=true; odTimer=0;
     if(score>best){best=score; localStorage.setItem("eggBest",String(best));} showOver(); } }
  else { if(odTimer>0) odTimer=Math.max(0,odTimer-dt*odDecay); }
  window.__OD=(odTimer>0)?Math.max(0,Math.ceil((OVERTIME-odTimer)*1000)):0; }
 render(now); requestAnimationFrame(loop); }

function startGame(){ resetGame(); overlay.classList.add("hidden"); snd(660,0.08,"square"); }
function showOver(){ overlay.querySelector("h1").textContent="💥 蛋堆满啦！"; overlay.querySelector("p").innerHTML="本局分数 <b>"+score+"</b> · 最高 <b>"+best+"</b>"; startBtn.textContent="再玩一次"; overlay.classList.remove("hidden"); }
startBtn.addEventListener("click",function(e){ e.stopPropagation(); startGame(); });

loadEggs();
loop(performance.now());
})();
